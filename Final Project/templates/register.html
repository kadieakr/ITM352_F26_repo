{% extends "base.html" %}
{% block title %}Create account | Hawaii Internships{% endblock %}
{% block content %}
<section class="panel">
    <h1>Create an account</h1>
    <p>Save internships and keep your shortlist in one place.</p>
    <form method="post">
        <p><label for="email">Email</label><br><input id="email" name="email" type="email" autocomplete="email" required></p>
        <p><label for="password">Password (at least 6 characters)</label><br><input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required></p>
        <button type="submit">Create account</button>
    </form>
    <p>Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
</section>
{% endblock %}
