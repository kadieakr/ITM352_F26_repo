{% extends "base.html" %}
{% block title %}Log in | Hawaii Internships{% endblock %}
{% block content %}
<section class="panel">
    <h1>Log in</h1>
    <form method="post">
        <p><label for="email">Email</label><br><input id="email" name="email" type="email" autocomplete="email" required></p>
        <p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="current-password" required></p>
        <button type="submit">Log in</button>
    </form>
    <p>New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</section>
{% endblock %}
